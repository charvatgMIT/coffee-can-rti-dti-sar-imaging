<style>
:root {
  --bg: #f5f5f7;
  --panel: #ffffff;
  --plot-bg: #ffffff;
  --text: #1d1d1f;
  --text2: #6e6e73;
  --border: rgba(0, 0, 0, 0.12);
  --grid: rgba(110, 110, 115, 0.22);
  --accent: #0a84ff;
  --orange: #ff9500;
  --red: #ff3b30;
  --purple: #af52de;
  --green: #34c759;
  --input-bg: #ffffff;
  --sel: rgba(10, 132, 255, 0.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --plot-bg: #1e1e20;
    --text: #f2f2f7;
    --text2: #a1a1a6;
    --border: rgba(255, 255, 255, 0.14);
    --grid: rgba(160, 160, 170, 0.22);
    --input-bg: #3a3a3c;
    --sel: rgba(10, 132, 255, 0.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
#app { display: flex; height: 100vh; min-height: 560px; }
#sidebar { width: 330px; flex: none; overflow-y: auto; border-right: 1px solid var(--border); padding: 10px 12px 24px; background: var(--bg); }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.small { padding: 1px 8px; font-size: 12px; }
button:disabled { opacity: 0.5; cursor: default; }
select, input[type=number], input[type=text] { background: var(--input-bg); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
input[type=number] { width: 84px; text-align: right; }
.num { font-variant-numeric: tabular-nums; }
#toolbar { display: flex; align-items: center; gap: 8px; }
#toolbar .logo { width: 28px; height: 28px; }
#toolbar .appname { font-size: 15px; margin-right: 8px; white-space: nowrap; }
#toolbar select { max-width: 340px; }
.spacer { flex: 1; }
#stats { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; min-width: 0; }
.tile .t { font-size: 10.5px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tile.warn .v { color: var(--red); }
.status { font-size: 12px; color: var(--text2); min-height: 16px; }
.status.error { color: var(--red); }
.suggestion { display: flex; align-items: center; gap: 10px; background: rgba(255, 149, 0, 0.13); border-radius: 8px; padding: 7px 10px; }
#tabs, .segmented { display: inline-flex; align-self: center; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
#tabs button, .segmented button { border: none; border-radius: 0; padding: 4px 18px; background: var(--panel); }
#tabs button + button, .segmented button + button { border-left: 1px solid var(--border); }
#tabs button.active, .segmented button.active { background: var(--accent); color: #fff; }
.segmented.small button { padding: 1px 10px; font-size: 11.5px; }
.tab { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
.row { display: flex; gap: 8px; align-items: center; }
.row.grow { flex: 1; min-height: 0; align-items: stretch; }
.slider-row label { color: var(--text2); white-space: nowrap; }
.slider-row { flex-wrap: wrap; row-gap: 4px; }
.slider-row input[type=range] { flex: 1; min-width: 90px; max-width: 320px; }
.small-text { font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; min-height: 160px; min-width: 0; }
.card.grow { flex: 1; }
.card-head { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; color: var(--text2); }
.card-head span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head span:last-child { white-space: nowrap; }
.card canvas { flex: 1; min-height: 100px; width: 100%; display: block; }
/* sidebar */
.sec { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
.sec h3 { margin: 0; padding: 8px 10px 4px; font-size: 12px; color: var(--text2); font-weight: 600; }
.ctl { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 10px; border-top: 1px solid var(--border); }
.ctl:first-of-type { border-top: none; }
.ctl > label:first-child { flex: 1; }
.ctl select { max-width: 175px; }
.help { padding: 4px 10px 8px; font-size: 11px; color: var(--text2); line-height: 1.35; border-top: 1px solid var(--border); }
.ctl.buttons { justify-content: flex-start; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: rgba(120, 120, 128, 0.32); border-radius: 10px; transition: 0.15s; cursor: pointer; }
.switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::before { transform: translateX(14px); }
.switch input:disabled + span { opacity: 0.5; }
/* how it works */
#tab-how { padding: 4px 2px; }
#tab-how h2 { font-size: 17px; margin: 4px 0; }
#tab-how h3 { font-size: 13px; margin: 6px 0 4px; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--text2); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.diagram { display: flex; flex-direction: column; align-items: stretch; }
.diagram .arrow { text-align: center; color: var(--text2); font-size: 13px; line-height: 16px; }
.diagram .brow { display: flex; gap: 8px; align-items: flex-start; }
.block { flex: 1; border-radius: 7px; padding: 7px 8px; border: 1px solid; }
.block b { font-size: 12.5px; }
.block div { font-size: 11px; color: var(--text2); margin-top: 2px; line-height: 1.3; }
.block.off { opacity: 0.6; border-style: dashed; }
.block .tag { font-size: 9.5px; border: 1px solid var(--text2); border-radius: 8px; padding: 0 5px; margin-left: 6px; color: var(--text2); }
.cols { display: flex; gap: 16px; align-items: flex-start; }
.cols > div { flex: 1; min-width: 0; }
.about { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 12px; font-size: 12.5px; line-height: 1.45; }
.about a { color: var(--accent); word-break: break-all; }
@media (max-width: 900px) {
  #app { flex-direction: column; height: auto; }
  #sidebar { width: auto; border-right: none; border-bottom: 1px solid var(--border); max-height: none; }
  #main { overflow: visible; }
  #stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .card { min-height: 240px; }
}
</style>
</head>

<script>window.CCR_BUNDLE = {"dsp": "// Coffee Can Radar web app: FFT, settings, windows, SVA and PGA.\n// Ported from the Mac app (RadarParams.swift, SVA.swift, RangePGA.swift, VCO.swift); keep them in step.\n(function (C) {\n  'use strict';\n\n  // ---------- FFT ----------\n  const plans = new Map();\n  function plan(log2n) {\n    let p = plans.get(log2n);\n    if (p) return p;\n    const n = 1 << log2n;\n    const rev = new Uint32Array(n);\n    for (let i = 0; i < n; i++) {\n      let r = 0, x = i;\n      for (let b = 0; b < log2n; b++) { r = (r << 1) | (x & 1); x >>= 1; }\n      rev[i] = r;\n    }\n    const cs = new Float64Array(n / 2 || 1), sn = new Float64Array(n / 2 || 1);\n    for (let k = 0; k < n / 2; k++) { cs[k] = Math.cos(2 * Math.PI * k / n); sn[k] = Math.sin(2 * Math.PI * k / n); }\n    p = { n, rev, cs, sn };\n    plans.set(log2n, p);\n    return p;\n  }\n\n  /** In-place complex FFT of the first 2^log2n values. Forward uses e^{-j}; the inverse is unscaled (as vDSP). */\n  function fft(re, im, log2n, inverse) {\n    const { n, rev, cs, sn } = plan(log2n);\n    for (let i = 0; i < n; i++) {\n      const j = rev[i];\n      if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }\n    }\n    const sg = inverse ? 1 : -1;\n    for (let size = 2; size <= n; size <<= 1) {\n      const half = size >> 1, step = n / size;\n      for (let i = 0; i < n; i += size) {\n        for (let k = 0, t = 0; k < half; k++, t += step) {\n          const wr = cs[t], wi = sg * sn[t];\n          const a = i + k, b = a + half;\n          const xr = re[b] * wr - im[b] * wi, xi = re[b] * wi + im[b] * wr;\n          re[b] = re[a] - xr; im[b] = im[a] - xi;\n          re[a] += xr; im[a] += xi;\n        }\n      }\n    }\n  }\n\n  // ---------- settings ----------\n  const speedOfLight = 3e8;\n\n  /** Mini-Circuits ZX95-2536C+ typical frequency vs. tuning voltage at +25 \u00b0C. */\n  const VCO = {\n    name: 'Mini-Circuits ZX95-2536C+',\n    curve: [[0.00, 2257.4], [0.50, 2297.3], [0.75, 2315.9], [1.00, 2334.4], [1.25, 2352.9],\n      [1.50, 2371.3], [1.75, 2389.8], [2.00, 2408.5], [2.25, 2427.0], [2.50, 2445.3],\n      [2.75, 2463.3], [3.00, 2481.0], [3.25, 2498.1], [3.50, 2514.5], [3.75, 2529.8],\n      [4.00, 2544.2], [4.25, 2557.6], [4.50, 2570.1], [4.75, 2581.5], [5.00, 2591.8]],\n    get minMHz() { return this.curve[0][1]; },\n    get maxMHz() { return this.curve[this.curve.length - 1][1]; },\n    volts(f) {\n      const c = this.curve;\n      const hi = c.findIndex(p => p[1] >= f);\n      if (hi < 0) return null;\n      if (hi === 0) return f === c[0][1] ? c[0][0] : null;\n      const a = c[hi - 1], b = c[hi];\n      return a[0] + (f - a[1]) / (b[1] - a[1]) * (b[0] - a[0]);\n    },\n  };\n\n  const BANDS = {\n    'Full VCO range (0\u20135 V)': [VCO.minMHz, VCO.maxMHz],\n    'ISM band': [2402, 2495],\n    'Custom': null,\n  };\n\n  /** Defaults follow read_data_RTI.m and the Mac app (RadarParams.swift). */\n  function defaultParams() {\n    return {\n      tpMs: 5, band: 'Full VCO range (0\u20135 V)', fStartMHz: VCO.minMHz, fStopMHz: VCO.maxMHz,\n      syncOnRight: false, invert: true, threshold: 0, holdoff: 11, interpolation: 16, align: true,\n      background: 'Subtract mean pulse', meanLength: 200,\n      window: 'Rectangular', taylorNbar: 4, taylorSidelobeDB: 30,\n      rangeMethod: 'FFT', pencilDisplay: 'Pseudospectrum', pencilOrderRule: 'ESTER (adaptive)', esterThreshold: 0.3,\n      autoTop: false, pencilForwardBackward: true, pencilMaxTargets: 8, pencilThresholdDB: 40, pencilL: 0, pencilPeakWidth: 1,\n      svaEnabled: false, zeroPad: 4, traceAveraging: 1, peakHold: false,\n      dbTop: -10, dbRange: 80, rtiDbRange: 80, maxRangeShown: 0, rtiSeconds: 30, rtiViewSeconds: 0, rangeUnit: 'Feet',\n      pgaEnabled: false, pgaPulses: 64, pgaIterations: 8, pgaMinRange: 1.0, pgaMinAgreement: 0.8,\n      rdEnabled: true, rdPulses: 64, rdWindow: 'Hann', rdDbRange: 40, rdRangePGA: true, rdDopplerPGA: true,\n      rdSuperRes: 'Matrix pencil in range and Doppler', rdOrderRule: 'ESTER (adaptive)', rdShowScatterers: false,\n      rejectGlitches: true,   // web only: skip pulses whose sync period jumps (dropped or repeated audio blocks)\n      // Doppler vs. time (unmodulated CW), after read_data_doppler.m\n      dtDwellMs: 250, dtOverlap: 0, dtTopOffsetDB: 0, dtCarrierMHz: 2590, dtZeroPad: 4, dtWindow: 'Rectangular', dtSVA: false, dtPGA: false,\n      dtPGAMinVelocity: 1, dtMethod: 'FFT', dtOrderRule: 'ESTER (adaptive)', dtMaxTargets: 8,\n      dtPencilDisplay: 'Pseudospectrum', dtMaxVelocity: 40, dtDbRange: 35, dtSubtractMean: true, dtHistorySeconds: 60,\n    };\n  }\n\n  function bandMatches(name, p) {\n    const r = BANDS[name];\n    return !!r && Math.abs(p.fStartMHz - r[0]) < 0.05 && Math.abs(p.fStopMHz - r[1]) < 0.05;\n  }\n\n  /** Quantities that follow from the settings and the sample rate (Derived in RadarParams.swift). */\n  function derived(p, fs) {\n    const tp = p.tpMs * 1e-3;\n    const n = Math.max(16, Math.round(tp * fs));\n    const log2n = Math.ceil(Math.log2(Math.max(1, p.zeroPad) * n));\n    const nfft = 1 << log2n;\n    const bandwidth = Math.max(1, (p.fStopMHz - p.fStartMHz) * 1e6);\n    const rangeRes = speedOfLight / (2 * bandwidth);\n    const maxRange = rangeRes * n / 2;\n    const metersPerBin = (fs / nfft) * speedOfLight * tp / (2 * bandwidth);\n    const rShow = p.maxRangeShown > 0 ? Math.min(p.maxRangeShown, maxRange) : maxRange;\n    const nBins = Math.max(2, Math.min(nfft / 2, Math.ceil(rShow / metersPerBin) + 1));\n    return { fs, n, log2n, nfft, bandwidth, rangeRes, maxRange, metersPerBin, rShow, nBins };\n  }\n\n  function wavelength(p) { return speedOfLight / Math.max(1, (p.fStartMHz + p.fStopMHz) / 2 * 1e6); }\n\n  /** As MATLAB's taylorwin(n, nbar, -sidelobeDB). */\n  function taylorWindow(n, nbar, sidelobeDB) {\n    nbar = Math.max(1, nbar);\n    const a = Math.acosh(Math.pow(10, Math.abs(sidelobeDB) / 20)) / Math.PI;\n    const sp2 = nbar * nbar / (a * a + Math.pow(nbar - 0.5, 2));\n    const mi = [];\n    for (let m = 1; m < Math.max(1, nbar); m++) mi.push(m);\n    const fm = mi.map(m => {\n      const numer = mi.reduce((acc, j) => acc * (1 - m * m / sp2 / (a * a + Math.pow(j - 0.5, 2))), 1);\n      const denom = 2 * mi.filter(j => j !== m).reduce((acc, j) => acc * (1 - m * m / (j * j)), 1);\n      return (m % 2 === 1 ? 1 : -1) * numer / denom;\n    });\n    const w = new Float64Array(n);\n    for (let k = 0; k < n; k++) {\n      const xi = (k - 0.5 * n + 0.5) / n;\n      let s = 0;\n      for (let i = 0; i < mi.length; i++) s += fm[i] * Math.cos(2 * Math.PI * mi[i] * xi);\n      w[k] = 1 + 2 * s;\n    }\n    return w;\n  }\n\n  /** Window applied to each pulse before the FFT. `type` overrides p.window. */\n  function makeWindow(p, n, type) {\n    const t = type || p.window;\n    const w = new Float64Array(n);\n    for (let k = 0; k < n; k++) {\n      const x = 2 * Math.PI * k / (n - 1);\n      if (t === 'Hann') w[k] = 0.5 - 0.5 * Math.cos(x);\n      else if (t === 'Blackman') w[k] = 0.42 - 0.5 * Math.cos(x) + 0.08 * Math.cos(2 * x);\n      else w[k] = 1;\n    }\n    return t === 'Taylor' ? taylorWindow(n, p.taylorNbar, p.taylorSidelobeDB) : w;\n  }\n\n  // ---------- SVA ----------\n  function svaComponent(x, s) {\n    if (x * s >= 0) return x;                        // a <= 0: rectangular\n    if (Math.abs(x) >= 0.5 * Math.abs(s)) return x + 0.5 * s;   // a >= 0.5: Hann\n    return 0;                                        // some a in (0, 0.5) nulls it\n  }\n\n  /** Spatially variant apodization (Stankwitz et al. 1995) along range; unwindowed input, complex spectrum out. */\n  function svaSpectrum(zr, zi, n, log2n) {\n    const m = 1 << log2n;\n    const xr = new Float64Array(m), xi = new Float64Array(m), sr = new Float64Array(m), si = new Float64Array(m);\n    const c = (n - 1) / 2;\n    const lim = Math.min(n, zr.length);\n    for (let t = 0; t < lim; t++) {\n      const g = 2 * Math.cos(2 * Math.PI * (t - c) / n);\n      xr[t] = zr[t]; xi[t] = zi[t];\n      sr[t] = zr[t] * g; si[t] = zi[t] * g;\n    }\n    fft(xr, xi, log2n);\n    fft(sr, si, log2n);\n    for (let k = 0; k < m; k++) { xr[k] = svaComponent(xr[k], sr[k]); xi[k] = svaComponent(xi[k], si[k]); }\n    return { re: xr, im: xi };\n  }\n\n  // ---------- PGA ----------\n  /** Removes the least-squares line a + b t. */\n  function removeLinearTrend(x) {\n    const n = x.length;\n    if (n < 2) return;\n    const tMean = (n - 1) / 2;\n    let xMean = 0;\n    for (let t = 0; t < n; t++) xMean += x[t];\n    xMean /= n;\n    let num = 0, den = 0;\n    for (let t = 0; t < n; t++) { num += (t - tMean) * (x[t] - xMean); den += (t - tMean) * (t - tMean); }\n    const b = num / den;\n    for (let t = 0; t < n; t++) x[t] -= xMean + b * (t - tMean);\n  }\n\n  function rms(x) {\n    if (!x.length) return 0;\n    let s = 0;\n    for (let i = 0; i < x.length; i++) s += x[i] * x[i];\n    return Math.sqrt(s / x.length);\n  }\n\n  /** Phase gradient autofocus along fast time (range): the sweep phase error every pulse shares. */\n  class RangePGA {\n    constructor(n) {\n      this.n = n;\n      this.log2m = Math.ceil(Math.log2(n));\n      this.m = 1 << this.log2m;\n      this.block = [];\n      this.sinceUpdate = 0;\n      this.phase = null;\n      this.updates = 0;\n      this.accepted = 0;\n      this.lastAgreement = 0;\n      this.lastResidualRMS = 0;\n    }\n\n    /** Analytic signal of a real pulse (negative frequencies removed). */\n    analytic(x) {\n      const m = this.m, n = this.n;\n      const re = new Float64Array(m), im = new Float64Array(m);\n      for (let k = 0; k < Math.min(n, x.length); k++) re[k] = x[k];\n      fft(re, im, this.log2m);\n      for (let k = 1; k < m / 2; k++) { re[k] *= 2; im[k] *= 2; }\n      for (let k = m / 2 + 1; k < m; k++) { re[k] = 0; im[k] = 0; }\n      fft(re, im, this.log2m, true);\n      const s = 1 / m;\n      const ar = new Float64Array(n), ai = new Float // Coffee Can Radar web app: FFT, settings, windows, SVA and PGA.

  // ---------- FFT ----------
  const plans = new Map();
  function plan(log2n) {
    let p = plans.get(log2n);
    if (p) return p;
    const n = 1 << log2n;
    const rev = new Uint32Array(n);
    for (let i = 0; i < n; i++) {
      let r = 0, x = i;
      for (let b = 0; b < log2n; b++) { r = (r << 1) | (x & 1); x >>= 1; }

    }

    plans.set(log2n, p);

  /** In-place complex FFT of the first 2^log2n values. Forward uses e^{-j}; the inverse is unscaled (as vDSP). */

      const edges = fixed ? edgesPer[row].slice(0, k) : edgesPer[row];
      const sif = new Float64Array(n);
      for (const e of edges) {
        if (p.alignment !== MIT_ALIGN) { const x = alignedPulse(rp, e.t, n); for (let j = 0; j < n; j++) sif[j] += x[j]; }
        else for (let j = 0; j < n; j++) sif[j] += rp[e.i + j];
      }
      for (let j = 1; j < Math.max(1, edges.length); j++) {
        periodsInt.push(edges[j].i - edges[j - 1].i);
        if (p.alignment !== MIT_ALIGN) periodsInterp.push(edges[j].t - edges[j - 1].t);
      }
      const count = edges.length;
      pulses.push(count);
      const scaled = sif.map(v => v / count);
      const [qr, qi] = dft(scaled, new Float64Array(n), true);
      const [yr, yi] = dft(qr.slice(half, n), qi.slice(half, n), false);
      for (let j = 0; j < half; j++) {
        outRe[row * half + j] = isNaN(yr[j]) ? 1e-30 : yr[j];
        outIm[row * half + j] = isNaN(yi[j]) ? 0 : yi[j];
      }
    });
    const jitter = (a) => {
      if (a.length <= 2) return null;
      const med = a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
      const near = a.filter(v => Math.abs(v - med) < 0.25 * med);
      return near.length > 2 ? stdDev(near) / fs * 1e6 : null;
    };
    return {
      fs, n, positions: starts.length, pulsesPerPosition: pulses, re: outRe, im: outIm, seconds: total / fs,
      jitterIntegerUs: jitter(periodsInt), jitterInterpUs: jitter(periodsInterp), prepared: false,
      rangePhase: null, crossPhase: null, requestedChirps: p.chirpsPerPosition, availableChirpsMin: availableMin,
      get cols() { return Math.floor(this.n / 2); },
    };
  }

  // ---------- mean subtraction ----------
  function subtractApertureMean(re, im, M, nt, mit) {
    if (mit) { subtractMeanLikeMATLAB(re, im, M, nt); return; }
    for (let k = 0; k < nt; k++) {
      let mr = 0, mi = 0;
      for (let r = 0; r < M; r++) { mr += re[r * nt + k]; mi += im[r * nt + k]; }
      mr /= M; mi /= M;
      for (let r = 0; r < M; r++) { re[r * nt + k] -= mr; im[r * nt + k] -= mi; }
    }
  }
  function subtractMeanLikeMATLAB(re, im, M, nt) {
    const sr = new Float64Array(nt), si = new Float64Array(nt);
    for (let r = 0; r < M; r++) for (let k = 0; k < nt; k++) { sr[k] += re[r * nt + k]; si[k] += im[r * nt + k]; }
    for (let r = 0; r < M; r++) for (let k = 0; k < nt; k++) {
      const mr = sr[k] / M, mi = si[k] / M;
      re[r * nt + k] -= mr; im[r * nt + k] -= mi; sr[k] -= mr; si[k] -= mi;
    }
  }
  const hannN = (nt) => { const h = new Float64Array(nt); for (let i = 1; i <= nt; i++) h[i - 1] = 0.5 + 0.5 * Math.cos(2 * Math.PI * (i - nt / 2) / nt); return h; };

  // ---------- SBAND_RMA_IFP.m: range migration ----------
  const RMA_SIGNS = [1, 1, -1];
  function formImageRMA(data, p) {
    const M = data.positions, nt = data.cols;
    const re = Float64Array.from(data.re), im = Float64Array.from(data.im);
    if (p.subtractMean && !data.prepared) subtractApertureMean(re, im, M, nt, p.mitMean);
    const h = hannN(nt);
    if (!p.sva && p.bpHann) for (let r = 0; r < M; r++) for (let k = 0; k < nt; k++) { re[r * nt + k] *= h[k]; im[r * nt + k] *= h[k]; }
    const zpad = Math.max(p.zpad, 1 << log2Ceil(M)), lz = log2Ceil(zpad);
    const index = swiftRound((zpad - M) / 2);
    const Sr = new Float64Array(zpad * nt), Si = new Float64Array(zpad * nt);
    const colR = new Float64Array(zpad), colI = new Float64Array(zpad);
    for (let k = 0; k < nt; k++) {
      colR.fill(0); colI.fill(0);
      for (let r = 0; r < M; r++) { colR[index + r] = re[r * nt + k]; colI[index + r] = im[r * nt + k]; }
      fftScaled(colR, colI, lz, false);
      for (let i = 0; i < zpad; i++) { const sh = (i + zpad / 2) % zpad; Sr[sh * nt + k] = colR[i]; Si[sh * nt + k] = colI[i]; }
    }
    const dx = deltaX(p);
    const kx = linspace(-Math.PI / dx, Math.PI / dx, zpad);
    const kr = linspace(4 * Math.PI / speedOfLight * p.fStartMHz * 1e6, 4 * Math.PI / speedOfLight * p.fStopMHz * 1e6, nt);
    const rs = p.rsFeet / FT_PER_M;
    if (rs !== 0) {
      for (let i = 0; i < zpad; i++) for (let k = 0; k < nt; k++) {
        const d = kr[k] * kr[k] - kx[i] * kx[i];
        const cr = d >= 0 ? Math.cos(rs * Math.sqrt(d)) : Math.exp(-rs * Math.sqrt(-d)), ci = d >= 0 ? Math.sin(rs * Math.sqrt(d)) : 0;
        const a = Sr[i * nt + k], b = Si[i * nt + k];
        Sr[i * nt + k] = a * cr - b * ci; Si[i * nt + k] = a * ci + b * cr;
      }
    }
    const nky = p.nKy, kyEven = linspace(p.kStart, p.kStop, nky);
    const Str = new Float64Array(zpad * nky).fill(1e-30), Sti = new Float64Array(zpad * nky);
    const hk = hannN(nky), ky = new Float64Array(nt);
    for (let i = 0; i < zpad; i++) {
      for (let k = 0; k < nt; k++) ky[k] = Math.sqrt(kr[k] * kr[k] - kx[i] * kx[i]);
      let j = 0;
      for (let o = 0; o < nky; o++) {
        const y = kyEven[o];
        if (!(y >= ky[0] && y <= ky[nt - 1])) continue;
        while (j < nt - 2 && ky[j + 1] < y) j++;
        const f = (y - ky[j]) / (ky[j + 1] - ky[j]);
        const w = p.hannAfterStolt && !p.sva ? hk[o] : 1;
        Str[i * nky + o] = (Sr[i * nt + j] * (1 - f) + Sr[i * nt + j + 1] * f) * w;
        Sti[i * nky + o] = (Si[i * nt + j] * (1 - f) + Si[i * nt + j + 1] * f) * w;
      }
    }
    const kdb = new Float32Array(zpad * nky);
    let kmax = -Infinity;
    for (let i = 0; i < zpad * nky; i++) { kdb[i] = 10 * Math.log10(Str[i] * Str[i] + Sti[i] * Sti[i] + 1e-30); if (kdb[i] > kmax) kmax = kdb[i]; }
    const kSpace = { db: kdb, rows: zpad, cols: nky, maxDB: kmax };
    const m = 4 * zpad, n = 4 * nky;
    const bw = speedOfLight * (p.kStop - p.kStart) / (4 * Math.PI);
    const maxRange = speedOfLight * nky / (2 * bw) * FT_PER_M;
    const dr1 = p.downStartFt + p.rsFeet, dr2 = p.downStopFt + p.rsFeet;
    const apertureFt = zpad * dx * FT_PER_M;
    const dr1i = Math.max(1, swiftRound(dr1 / maxRange * n));
    const dr2i = Math.min(n, Math.max(dr1i, swiftRound(dr2 / maxRange * n)));
    const cr1i = Math.max(1, swiftRound((-p.crossRangeFt + apertureFt / 2) / apertureFt * m));
    const cr2i = Math.min(m, Math.max(cr1i, swiftRound((p.crossRangeFt + apertureFt / 2) / apertureFt * m)));
    const rows = dr2i - dr1i + 1, cols = cr2i - cr1i + 1;
    const k0 = n - dr2i, ln = log2Ceil(n), lm = log2Ceil(m);
    const Ar = new Float64Array(rows * zpad), Ai = new Float64Array(rows * zpad);
    const rr = new Float64Array(n), ri = new Float64Array(n);
    for (let i = 0; i < zpad; i++) {
      rr.fill(0); ri.fill(0);
      for (let k = 0; k < nky; k++) { rr[k] = Str[i * nky + k]; ri[k] = Sti[i * nky + k]; }
      fftScaled(rr, ri, ln, true);
      for (let c = 0; c < rows; c++) { Ar[c * zpad + i] = rr[k0 + c]; Ai[c * zpad + i] = ri[k0 + c]; }
    }
    const cre = new Float32Array(rows * cols), cim = new Float32Array(rows * cols);
    const xr = new Float64Array(m), xi = new Float64Array(m);
    for (let c = 0; c < rows; c++) {
      xr.fill(0); xi.fill(0);
      for (let i = 0; i < zpad; i++) { xr[i] = Ar[c * zpad + i]; xi[i] = Ai[c * zpad + i]; }
      fftScaled(xr, xi, lm, true);
      const row = dr2i - c - dr1i;
      for (let col = 0; col < cols; col++) { const x = m - (cr1i + col); cre[row * cols + col] = xr[x]; cim[row * cols + col] = xi[x]; }
    }
    const crShown = [cr1i / m * apertureFt - apertureFt / 2, cr2i / m * apertureFt - apertureFt / 2];
    if (p.sva) {
      const kc = 4 * Math.PI * (p.fStartMHz + p.fStopMHz) / 2 * 1e6 / speedOfLight;
      const ys = linspace(p.downStartFt, p.downStopFt, rows), xs = linspace(crShown[0], crShown[1], cols);
      for (let r = 0; r < rows; r++) {
        const y = ys[r] / FT_PER_M;
        for (let col = 0; col < cols; col++) {
          const x = xs[col] / FT_PER_M, R = Math.sqrt(x * x + y * y);
          const ph = RMA_SIGNS[0] * kc * R + RMA_SIGNS[1] * Math.PI / dx * x + RMA_SIGNS[2] * p.kStart * y;
          const cs = Math.fround(Math.cos(ph)), sn = Math.fround(Math.sin(ph));
          const i = r * cols + col, a = cre[i], b = cim[i];
          cre[i] = a * cs - b * sn; cim[i] = a * sn + b * cs;
        }
      }
    }
    const image = finishImage(cre, cim, rows, cols, crShown, [p.downStartFt, p.downStopFt], 0, M, p);
    return { image, kSpace };
  }

  // ---------- bpBasic.m: backprojection ----------
  const C_BP = 299792458;
  class BPProfiles {
    constructor(re, im, M, K, p, hann) {
      this.f = linspace(p.fStartMHz * 1e6, p.fStopMHz * 1e6, K);
      const deltaF = this.f[1] - this.f[0], L = deltaX(p) * M;
      this.antX = linspace(L / 2, -L / 2, M);
      this.r0 = (p.bpR0Ft > 0 ? p.bpR0Ft : (p.downStartFt + p.downStopFt) / 2) / FT_PER_M;
      this.nfft = 1 << log2Ceil(Math.max(p.bpNfft, 2 * K));
      const maxWr = C_BP / (2 * deltaF);
      this.binM = maxWr / this.nfft;
      this.rMin = -(this.nfft / 2) * this.binM; this.rMax = (this.nfft / 2 - 1) * this.binM;
      const h = new Float64Array(K);
      for (let i = 1; i <= K; i++) h[i - 1] = hann ? 0.5 + 0.5 * Math.cos(2 * Math.PI * (i - K / 2) / K) : 1;
      const nfft = this.nfft, lg = log2Ceil(nfft);
      this.rcRe = new Float64Array(M * nfft); this.rcIm = new Float64Array(M * nfft);
      const xr = new Float64Array(nfft), xi = new Float64Array(nfft);
      for (let ii = 0; ii < M; ii++) {
        xr.fill(0); xi.fill(0);
        for (let k = 0; k < K; k++) {
          const a = re[ii * K + k] * h[k], b = -im[ii * K + k] * h[k];
          const ph = 4 * Math.PI * this.f[k] * this.r0 / C_BP, cs = Math.cos(ph), sn = Math.sin(ph);
          xr[k] = a * cs - b * sn; xi[k] = a * sn + b * cs;
        }
        fftScaled(xr, xi, lg, true);
        for (let k = 0; k < nfft; k++) { const sh = (k + nfft / 2) % nfft; this.rcRe[ii * nfft + sh] = xr[k]; this.rcIm[ii * nfft + sh] = xi[k]; }
      }
      this.k4 = 4 * Math.PI * this.f[0] / C_BP;
      this.M = M;
    }
    /** Fields needed to rebuild in another worker. */
    pack() { return { f: this.f, antX: this.antX, r0: this.r0, nfft: this.nfft, binM: this.binM, rMin: this.rMin, rMax: this.rMax, rcRe: this.rcRe, rcIm: this.rcIm, k4: this.k4, M: this.M }; }
    static unpack(o) { const b = Object.create(BPProfiles.prototype); Object.assign(b, o); return b; }
    /** Contribution of position ii to the pixel (x, y) metres, into out[0], out[1]. */
    contribution(ii, x, y, out) {
      const ddx = this.antX[ii] - x, dR = Math.sqrt(ddx * ddx + y * y) - this.r0;
      out[0] = 0; out[1] = 0;
      if (!(dR > this.rMin && dR < this.rMax)) return;
      const u = dR / this.binM + this.nfft / 2, i0 = Math.trunc(u), fr = u - i0;
      if (!(i0 + 1 < this.nfft)) return;
      const base = ii * this.nfft;
      const vr = this.rcRe[base + i0] * (1 - fr) + this.rcRe[base + i0 + 1] * fr;
      const vi = this.rcIm[base + i0] * (1 - fr) + this.rcIm[base + i0 + 1] * fr;
      const ph = this.k4 * dR, cs = Math.cos(ph), sn = Math.sin(ph);
      out[0] = vr * cs - vi * sn; out[1] = vr * sn + vi * cs;
    }
  }

  /** Backprojects image rows r0 ..< r1 (the per-row work, also run in helper workers). */
  function backprojectRows(bp, xs, ys, cols, r0, r1, sva, fMid) {
    const M = bp.M, nfft = bp.nfft, out = new Float32Array((r1 - r0) * cols * 2);
    const accRe = new Float64Array(cols), accIm = new Float64Array(cols);
    for (let r = r0; r < r1; r++) {
      const y = ys[r];
      accRe.fill(0); accIm.fill(0);
      for (let ii = 0; ii < M; ii++) {
        const ax = bp.antX[ii], base = ii * nfft;
        for (let col = 0; col < cols; col++) {
          const ddx = ax - xs[col], dR = Math.sqrt(ddx * ddx + y * y) - bp.r0;
          if (!(dR > bp.rMin && dR < bp.rMax)) continue;
          const u = dR / bp.binM + nfft / 2, i0 = Math.trunc(u), fr = u - i0;
          if (!(i0 + 1 < nfft)) continue;
          const vr = bp.rcRe[base + i0] * (1 - fr) + bp.rcRe[base + i0 + 1] * fr;
          const vi = bp.rcIm[base + i0] * (1 - fr) + bp.rcIm[base + i0 + 1] * fr;
          const ph = bp.k4 * dR, cs = Math.cos(ph), sn = Math.sin(ph);
          accRe[col] += vr * cs - vi * sn;
          accIm[col] += vr * sn + vi * cs;
        }
      }
      const o = (r - r0) * cols * 2;
      for (let col = 0; col < cols; col++) {
        let a = accRe[col], b = accIm[col];
        if (sva) {
          const R = Math.sqrt(xs[col] * xs[col] + y * y), ph = -4 * Math.PI * fMid * (R - bp.r0) / C_BP;
          const cs = Math.cos(ph), sn = Math.sin(ph);
          const t = a * cs - b * sn; b = a * sn + b * cs; a = t;
        }
        out[o + col] = a; out[o + cols + col] = b;
      }
    }
    return out;
  }

  /** Runs `rowsFn(r0, r1)` over all rows, in parallel when a pool is given (async), else in this thread. */
  async function runRows(rows, pool, task, local) {
    if (!pool || pool.size < 2 || rows < 64) return [local(0, rows)];
    const chunks = Math.min(rows, pool.size * 4), step = Math.ceil(rows / chunks), jobs = [];
    for (let r0 = 0; r0 < rows; r0 += step) jobs.push(pool.run(Object.assign({}, task, { r0, r1: Math.min(rows, r0 + step) })));
    return Promise.all(jobs);
  }

  async function backproject(data, p, pool) {
    const M = data.positions, K = data.cols;
    const re = Float64Array.from(data.re), im = Float64Array.from(data.im);
    if (p.subtractMean && !data.prepared) subtractApertureMean(re, im, M, K, p.mitMean);
    const bp = new BPProfiles(re, im, M, K, p, p.bpHann && !p.sva);
    const px = Math.max(0.01, p.bpPixelFt);
    const cols = Math.max(2, swiftRound(2 * p.crossRangeFt / px) + 1);
    const rows = Math.max(2, swiftRound((p.downStopFt - p.downStartFt) / px) + 1);
    const xs = linspace(-p.crossRangeFt, p.crossRangeFt, cols).map(v => v / FT_PER_M);
    const ys = linspace(p.downStartFt, p.downStopFt, rows).map(v => v / FT_PER_M);
    const fMid = (bp.f[0] + bp.f[K - 1]) / 2;
    if (pool) pool.setShared({ bp: bp.pack(), xs, ys, cols, sva: p.sva, fMid });
    const parts = await runRows(rows, pool, { op: 'bp' }, (r0, r1) => ({ r0, r1, out: backprojectRows(bp, xs, ys, cols, r0, r1, p.sva, fMid) }));
    const cre = new Float32Array(rows * cols), cim = new Float32Array(rows * cols);
    for (const part of parts) {
      for (let r = part.r0; r < part.r1; r++) {
        const o = (r - part.r0) * cols * 2;
        cre.set(part.out.subarray(o, o + cols), r * cols);
        cim.set(part.out.subarray(o + cols, o + 2 * cols), r * cols);
      }
    }
    let note = null;
    if (inCross(p)) note = await crossrangePencil(bp, xs, ys, cre, cim, rows, cols, M, p, pool);
    const img = finishImage(cre, cim, rows, cols, [-p.crossRangeFt, p.crossRangeFt], [p.downStartFt, p.downStopFt], 0, M, p);
    img.pencilNote = note;
    return img;
  }

  // ---------- autofocus ----------
  function autofocus(data, p) {
    const d = Object.assign({}, data, { re: Float64Array.from(data.re), im: Float64Array.from(data.im) });
    Object.defineProperty(d, 'cols', { get() { return Math.floor(this.n / 2); } });
    const M = d.positions, K = d.cols;
    if (p.subtractMean) subtractApertureMean(d.re, d.im, M, K, p.mitMean);
    if (p.rangePGA) d.rangePhase = rangePGA(d.re, d.im, M, K, Math.max(1, p.pgaIterations));
    if (p.crossPGA) {
      const psi = crossAutofocus(d.re, d.im, M, K, p);
      for (let ii = 0; ii < M; ii++) {
        const cs = Math.cos(psi[ii]), sn = -Math.sin(psi[ii]);
        for (let k = 0; k < K; k++) {
          const i = ii * K + k, a = d.re[i], b = d.im[i];
          d.re[i] = a * cs - b * sn; d.im[i] = a * sn + b * cs;
        }
      }
      d.crossPhase = Array.from(psi, v => -v);
    }
    d.prepared = true;
    return d;
  }

  function rangePGA(re, im, M, K, iterations) {
    const P = 1 << log2Ceil(2 * K), lp = log2Ceil(P);
    const total = new Float64Array(K), gr = new Float64Array(P), gi = new Float64Array(P);
    const cr = Array.from({ length: M }, () => new Float64Array(P)), ci = Array.from({ length: M }, () => new Float64Array(P));
    for (let it = 0; it < iterations; it++) {
      const avg = new Float64Array(P);
      for (let r = 0; r < M; r++) {
        for (let t = 0; t < P; t++) { gr[t] = t < K ? re[r * K + t] : 0; gi[t] = t < K ? im[r * K + t] : 0; }
        fftScaled(gr, gi, lp, false);
        let q0 = 0, best = -1;
        for (let q = 0; q < P; q++) { const pw = gr[q] * gr[q] + gi[q] * gi[q]; if (pw > best) { best = pw; q0 = q; } }
        for (let q = 0; q < P; q++) { const s = (q + q0) % P; cr[r][q] = gr[s]; ci[r][q] = gi[s]; avg[q] += gr[s] * gr[s] + gi[s] * gi[s]; }
      }
      let ext = 0;
      while (ext < P / 2 - 1 && (avg[(ext + 1) % P] > 0.1 * avg[0] || avg[(P - ext - 1) % P] > 0.1 * avg[0])) ext++;
      const half = Math.min(P / 2, Math.max(3, Math.ceil(1.5 * (ext + 1))));
      const sr = new Float64Array(K), si = new Float64Array(K);
      for (let r = 0; r < M; r++) {
        for (let q = 0; q < P; q++) { const signed = q <= P / 2 ? q : q - P, keep = Math.abs(signed) <= half; gr[q] = keep ? cr[r][q] : 0; gi[q] = keep ? ci[r][q] : 0; }
        fftScaled(gr, gi, lp, true);
        for (let t = 1; t < K; t++) { sr[t] += gr[t - 1] * gr[t] + gi[t - 1] * gi[t]; si[t] += gr[t - 1] * gi[t] - gi[t - 1] * gr[t]; }
      }
      const phi = new Float64Array(K);
      for (let t = 1; t < K; t++) phi[t] = phi[t - 1] + Math.atan2(si[t], sr[t]);
      removeLinearTrend(phi);
      for (let t = 0; t < K; t++) {
        total[t] += phi[t];
        const cs = Math.cos(phi[t]), sn = -Math.sin(phi[t]);
        for (let r = 0; r < M; r++) { const i = r * K + t, a = re[i], b = im[i]; re[i] = a * cs - b * sn; im[i] = a * sn + b * cs; }
      }
      if (rms(phi) < 0.01) break;
    }
    removeLinearTrend(total);
    return Array.from(total);
  }

  function crossAutofocus(re, im, M, K, p) {
    const bp = new BPProfiles(re, im, M, K, p, true);
    const span = Math.min(p.crossRangeFt, 150), y0 = Math.max(30, p.downStartFt), y1 = p.downStopFt, step = 1;
    const nx = Math.trunc(2 * span / step) + 1, ny = Math.trunc((y1 - y0) / step) + 1;
    const mag = new Float64Array(nx * ny), v = new Float64Array(2);
    for (let r = 0; r < ny; r++) {
      const y = (y0 + r * step) / FT_PER_M;
      for (let c = 0; c < nx; c++) {
        const x = (-span + c * step) / FT_PER_M;
        let a = 0, b = 0;
        for (let ii = 0; ii < M; ii++) { bp.contribution(ii, x, y, v); a += v[0]; b += v[1]; }
        mag[r * nx + c] = a * a + b * b;
      }
    }
    const cand = [];
    for (let r = 1; r < Math.max(1, ny - 1); r++) {
      const y = y0 + r * step;
      for (let c = 1; c < Math.max(1, nx - 1); c++) {
        const i = r * nx + c, val = mag[i];

      if (picks.length >= 200) break;

  // ---------- entry point ----------
  async function formSARImage(data, p, pool) {
    let d = data, q = p;
    const note = [];
    if (inCross(p)) q = Object.assign({}, q, { sva: false });
    if (inCross(p) && p.algorithm === RMA) note.push('crossrange pencil needs backprojection');
    if (inRange(p)) {
      const t0 = Date.now();
      const r = bandwidthExtrapolate(data, p);
      d = r.data; q = r.params;   // as the Mac app: the range step's settings (from p) replace q
      note.push(`range pencil: median order ${r.medianOrder}, band ${q.fStartMHz.toFixed(0)}–${q.fStopMHz.toFixed(0)} MHz (${((Date.now() - t0) / 1000).toFixed(2)} s)`);
    }
    const res = await formUnmasked(d, q, pool);
    if (res.image.pencilNote) note.push(res.image.pencilNote);
    res.image.pencilNote = note.length ? note.join('; ') : null;
    if (p.blankGratingLobes) blankGratingLobes(res.image, q);
    return res;
  }

  async function formUnmasked(data, p, pool) {
    const form = async q => q.algorithm === RMA ? formImageRMA(data, q) : { image: await backproject(data, q, pool), kSpace: null };
    if (!(p.sva && (p.svaMode === 'Dual apodization (rect/Hann minimum)' || p.svaHannCap))) return form(p);
    const hann = Object.assign({}, p, { sva: false, bpHann: true });

    for (let i = 0; i < out.db.length; i++) { out.db[i] = Math.min(out.db[i], h.image.db[i] + gain); if (out.db[i] > mx) mx = out.db[i]; }
    out.maxDB = mx;
    return rect;
  }

  function gratingLobeFreeAngle(p) {
    const lambdaMin = speedOfLight / (p.fStopMHz * 1e6);
    return Math.asin(Math.min(1, lambdaMin / (4 * deltaX(p))));
  }

  function blankGratingLobes(img, p) {
    const sinMax = Math.sin(gratingLobeFreeAngle(p));
    if (!(sinMax < 1)) return;

    let mx = -Infinity;

      const x = xs[c], y = ys[r], R = Math.sqrt(x * x + y * y), i = r * img.cols + c;

  }

  // ---------- matrix pencil super-resolution ----------
  function bandwidthExtrapolate(d, p) {
    const M = d.positions, K = d.cols;
    const E = Math.trunc(K * Math.max(0, p.bweFactor - 1) / 2), K2 = K + 2 * E;
    const df = (p.fStopMHz - p.fStartMHz) / (K - 1);
    const outRe = new Float64Array(M * K2), outIm = new Float64Array(M * K2), orders = new Array(M).fill(0);
    const mp = new MatrixPencil(K, Math.trunc(K / 3));
    for (let ii = 0; ii < M; ii++) {
      const re = d.re.subarray(ii * K, ii * K + K), im = d.im.subarray(ii * K, ii * K + K);
      const rowR = new Float64Array(K2), rowI = new Float64Array(K2);
      for (let k = 0; k < K; k++) { rowR[E + k] = re[k]; rowI[E + k] = im[k]; }

          }
          for (let a = 0; a < J; a++) { const x = wr[a], y = wi[a]; wr[a] = x * pr[a] - y * pi[a]; wi[a] = x * pi[a] + y * pr[a]; }

          for (let a = 0; a < J; a++) {
            const ir = pr[a], ii2 = -pi[a];

            for (let k = 0; k < K; k++) { const x = hr, y = hi; hr = x * pr[a] - y * pi[a]; hi = x * pi[a] + y * pr[a]; }

              rowR[E + K + e] += hr; rowI[E + K + e] += hi;
              { const x = hr, y = hi; hr = x * pr[a] - y * pi[a]; hi = x * pi[a] + y * pr[a]; }
            }

      }
      outRe.set(rowR, ii * K2); outIm.set(rowI, ii * K2);
    }
    const out = Object.assign({}, d, { n: 2 * K2, re: outRe, im: outIm });
    Object.defineProperty(out, 'cols', { get() { return Math.floor(this.n / 2); } });
    const q = Object.assign({}, p, { bpHann: false, fStartMHz: p.fStartMHz - E * df, fStopMHz: p.fStopMHz + E * df });
    const kAdd = 4 * Math.PI * E * df * 1e6 / speedOfLight;
    q.kStop = p.kStop + kAdd;
    q.kStart = Math.max(1, p.kStart - kAdd);
    q.nKy = 1 << log2Ceil(Math.trunc(p.nKy * (q.kStop - q.kStart) / (p.kStop - p.kStart)));
    return { data: out, params: q, medianOrder: orders.slice().sort((a, b) => a - b)[Math.floor(M / 2)] };
  }

  const pencilScale = (p) => (x, y) => p.rangeScaling ? Math.pow(p.scaleBySlantRange ? x * x + y * y : y * y, 1.5) : 1;

  /** Crossrange pencil for rows r0 ..< r1 (also run in helper workers). Writes re/im rows in place; returns [fitted, orderSum]. */
  function crossPencilRows(bp, xs, ys, re, im, cols, r0, r1, M, p, floorPow, rowOffset) {
    const scale = pencilScale(p);
    const sinMax = p.blankGratingLobes ? Math.sin(gratingLobeFreeAngle(p)) : 2;
    const eps = 2 * Math.PI / M * Math.max(0.02, p.crossPeakWidth), eps2 = eps * eps;
    const mp = new MatrixPencil(M, Math.max(2, Math.trunc(M / 3)));
    const cr = new Float64Array(M), ci = new Float64Array(M), v = new Float64Array(2);
    let fitted = 0, orderSum = 0;
    for (let r = r0; r < r1; r++) {
      const y = ys[r];
      for (let c = 0; c < cols; c++) {
        const i = (r - rowOffset) * cols + c, x = xs[c];
        const a = re[i], b = im[i], pw = a * a + b * b;

        const R = Math.sqrt(x * x + y * y);
        if (!(R > 0 && Math.abs(x) / R <= sinMax)) continue;
        for (let ii = 0; ii < M; ii++) { bp.contribution(ii, x, y, v); cr[ii] = v[0]; ci[ii] = v[1]; }
        const fit = mp.analyze(cr, ci, Math.max(1, p.pencilMaxTargets), 40, p.pencilRule, false, p.esterThreshold, p.pencilFB);
        if (!fit || fit.order <= 0) continue;
        let power = 0;
        for (let m = 0; m < fit.order; m++) { const w = Math.atan2(fit.polesI[m], fit.polesR[m]); power += fit.power[m] * M * M * eps2 / (w * w + eps2); }

  async function crossrangePencil(bp, xs, ys, re, im, rows, cols, M, p, pool) {
    const t0 = Date.now(), scale = pencilScale(p);
    let top = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const i = r * cols + c; top = Math.max(top, (re[i] * re[i] + im[i] * im[i]) * scale(xs[c], ys[r])); }
    const floorPow = top * Math.pow(10, -p.dbRange / 10);

    if (pool && pool.size > 1 && rows >= 64) {
      const chunks = Math.min(rows, pool.size * 4), step = Math.ceil(rows / chunks), jobs = [];
      for (let r0 = 0; r0 < rows; r0 += step) {
        const r1 = Math.min(rows, r0 + step);
        jobs.push(pool.run({ op: 'xpencil', r0, r1, re: re.slice(r0 * cols, r1 * cols), im: im.slice(r0 * cols, r1 * cols), p, floorPow }));
      }
      for (const res of await Promise.all(jobs)) { re.set(res.re, res.r0 * cols); im.set(res.im, res.r0 * cols); fitted += res.fitted; orderSum += res.orderSum; }
    } else {
      [fitted, orderSum] = crossPencilRows(bp, xs, ys, re, im, cols, 0, rows, M, p, floorPow, 0);
    }
    return `crossrange pencil: ${fitted} pixels, mean order ${fitted ? (orderSum / fitted).toFixed(1) : '0.0'} (${((Date.now() - t0) / 1000).toFixed(1)} s)`;
  }

  // ---------- finishing: SVA, range scaling, dB ----------
  function finishImage(re, im, rows, cols, crossRange, downRange, rangeOffsetFt, M, p) {
    if (p.sva && p.svaMode !== 'Dual apodization (rect/Hann minimum)') svaImage(re, im, rows, cols, crossRange, downRange, M, p);
    const db = new Float32Array(rows * cols);
    const ys = linspace(downRange[0], downRange[1], rows), xs = linspace(crossRange[0], crossRange[1], cols);
    let mx = -Infinity;
    for (let r = 0; r < rows; r++) {
      const y = (ys[r] - rangeOffsetFt) / FT_PER_M;
      for (let c = 0; c < cols; c++) {
        let scale = 1;
        if (p.rangeScaling) { const x = xs[c] / FT_PER_M; scale = Math.fround(Math.pow(p.scaleBySlantRange ? Math.sqrt(x * x + y * y) : Math.abs(y), 1.5)); }
        const a = Math.fround(re[r * cols + c] * scale), b = Math.fround(im[r * cols + c] * scale);
        const v = 10 * Math.log10(Math.fround(Math.fround(a * a) + Math.fround(b * b)) + 1e-38);
        db[r * cols + c] = v;
        if (db[r * cols + c] > mx) mx = db[r * cols + c];
      }
    }
    return { db, rows, cols, crossRange, downRange, maxDB: mx, pencilNote: null };
  }

  class SummedArea {
    constructor(re, im, rows, cols) {
      this.rows = rows; this.cols = cols;
      const w = cols + 1;
      this.sr = new Float64Array((rows + 1) * w); this.si = new Float64Array((rows + 1) * w);
      for (let r = 0; r < rows; r++) {
        let rr = 0, ri = 0;
        for (let c = 0; c < cols; c++) {
          rr += re[r * cols + c]; ri += im[r * cols + c];
          this.sr[(r + 1) * w + c + 1] = this.sr[r * w + c + 1] + rr;
          this.si[(r + 1) * w + c + 1] = this.si[r * w + c + 1] + ri;
        }
      }
    }
    sum(r, c, half) {
      const w = this.cols + 1, sr = this.sr, si = this.si;
      const r0 = Math.max(0, r - half), r1 = Math.min(this.rows, r + half + 1), c0 = Math.max(0, c - half), c1 = Math.min(this.cols, c + half + 1);
      return [sr[r1 * w + c1] - sr[r0 * w + c1] - sr[r1 * w + c0] + sr[r0 * w + c0], si[r1 * w + c1] - si[r0 * w + c1] - si[r1 * w + c0] + si[r0 * w + c0]];
    }
  }

  function svaPick(x, s) {
    if (x * s >= 0) return x;
    if (Math.abs(x) >= 0.5 * Math.abs(s)) return x + 0.5 * s;
    return 0;
  }

  /** SVA on the complex image (Stankwitz et al.), along then across the line of sight; in place. */
  function svaImage(re, im, rows, cols, crossRange, downRange, M, p) {
    if (rows <= 2 || cols <= 2) return;
    const x0 = crossRange[0], y0 = downRange[0];
    const sx = (crossRange[1] - crossRange[0]) / (cols - 1), sy = (downRange[1] - downRange[0]) / (rows - 1);
    const rhoR = speedOfLight / (2 * (p.fStopMHz - p.fStartMHz) * 1e6) * FT_PER_M;
    const lambda = speedOfLight / ((p.fStartMHz + p.fStopMHz) / 2 * 1e6);
    const aperture = M * deltaX(p), step = Math.max(sx, sy), joint = p.svaMode === 'Joint I/Q';
    const f32 = Math.fround;
    function pass(sre, sim, along) {
      const sample = (x, y, out) => {
        const fc = (x - x0) / sx, fr = (y - y0) / sy;
        if (!(fc >= 0 && fr >= 0 && fc <= cols - 1 && fr <= rows - 1)) { out[0] = 0; out[1] = 0; return; }
        const c0 = Math.min(cols - 2, Math.trunc(fc)), r0 = Math.min(rows - 2, Math.trunc(fr));
        const tc = f32(fc - c0), tr = f32(fr - r0);

        const w00 = f32(f32(1 - tr) * f32(1 - tc)), w01 = f32(f32(1 - tr) * tc), w10 = f32(tr * f32(1 - tc)), w11 = f32(tr * tc);
        out[0] = f32(f32(f32(f32(sre[i00] * w00) + f32(sre[i01] * w01)) + f32(sre[i10] * w10)) + f32(sre[i11] * w11));
        out[1] = f32(f32(f32(f32(sim[i00] * w00) + f32(sim[i01] * w01)) + f32(sim[i10] * w10)) + f32(sim[i11] * w11));
      };

      const F = new Float32Array(5 * n), Dr = new Float64Array(n), Di = new Float64Array(n);
      const a = new Float64Array(2), b = new Float64Array(2), e = new Float64Array(2);
      for (let r = 0; r < rows; r++) {
        const y = y0 + r * sy;

          const x = x0 + c * sx, dd = along(x, y), dx = dd[0], dy = dd[1];

          const i = r * cols + c, xr = sre[i], xi = sim[i];
          F[i] = a[0]; F[n + i] = a[1]; F[2 * n + i] = b[0]; F[3 * n + i] = b[1];
          const len = Math.max(1e-9, Math.sqrt(dx * dx + dy * dy));

          const g = sat.sum(r, c, half);
          const kd = Math.atan2(g[1], g[0]) / step * F[4 * n + i];
          const cp = f32(Math.cos(kd)), sp = f32(Math.sin(kd)), cm = f32(Math.cos(-kd)), sm = f32(Math.sin(-kd));
          const aR = F[i], aI = F[n + i], bR = F[2 * n + i], bI = F[3 * n + i];

          const sIm = f32(f32(f32(bI * cp) - f32(bR * sp)) + f32(f32(aI * cm) - f32(aR * sm)));

            const s2 = f32(f32(sRe * sRe) + f32(sIm * sIm));

    const r1 = pass(re, im, (x, y) => { const R = Math.max(1e-6, Math.sqrt(x * x + y * y)); return [rhoR * x / R, rhoR * y / R]; });
    const r2 = pass(r1[0], r1[1], (x, y) => {
      const R = Math.max(1e-6, Math.sqrt(x * x + y * y)), cosT = Math.max(0.2, y / R);
      const rho = lambda * (R / FT_PER_M) / (2 * aperture * cosT) * FT_PER_M;
      return [rho * y / R, -rho * x / R];
    });
    re.set(r2[0]); im.set(r2[1]);
  }

  /** Range profile of every position (after mean subtraction and window). */
  function rangeProfiles(data, p) {
    const M = data.positions, nt = data.cols, nfft = 1 << log2Ceil(4 * nt), lg = log2Ceil(nfft);

    const y0 = o.y[0], y1 = o.y[1] > o.y[0] ? o.y[1] : o.y[0] + 1;

    configureView(pulses) {
      const total = Math.max(10, Math.min(pulses, this.rawCap));

// The RTI tab of "Coffee Can RTI DTI SAR Imaging" (RadarModel.swift, ContentView.swift, Plots.swift).
(function () {

  const BP_URL = 'https://github.com/bambang/osubp/blob/master/bpBasic.m';
  const OCW = 'https://ocw.mit.edu/courses/res-ll-003-build-a-small-radar-system-capable-of-sensing-range-doppler-and-synthetic-aperture-radar-imaging-january-iap-2011/resources/doppler-radar-using-the-coffee-can-radar/';

  const STORE = 'ccr.rti.params';

  }

    ? { per: 1 / 0.3048, ab: 'ft', finePer: 1 / 0.0254, fineAb: 'in' } : { per: 1, ab: 'm', finePer: 100, fineAb: 'cm' };

  let source = null;          // 'live' | 'sim' | 'file' | null
  let paused = false;
  let generation = -1;
  let rangeDoppler = null, rdImage = null;
  let trace = null, hold = null, scope = null, edge = null;
  let pgaPhase = null, pgaUpdates = 0, pgaAccepted = 0, pgaAgreement = null;

  // ---------------- status and stats ----------------
  function setStatus(text, error) { const el = $('status'); el.textContent = text; el.classList.toggle('error', !!error); }

  function renderStats() {
    const u = unit(), s = stats;
    const clip = (s.levelL || 0) > 0.99 || (s.levelR || 0) > 0.99;
    const dbfs = v => v > 0 ? (20 * Math.log10(v)).toFixed(1) : '−∞';
    const tiles = [
      ['Sample rate / N', `${(d.fs / 1000).toFixed(1)} kHz / ${d.n}`],
      ['Range res. / max range', `${(d.rangeRes * u.finePer).toFixed(1)} ${u.fineAb} / ${(d.maxRange * u.per).toFixed(1)} ${u.ab}`],
      ['Pulse rate', s.pulseRateHz != null ? `${s.pulseRateHz.toFixed(2)} Hz (${s.periodMs.toFixed(3)} ms)` : '–'],
      ['Period jitter σ: integer → interp.', s.jitterIntegerUs != null ? `${s.jitterIntegerUs.toFixed(2)} → ${s.jitterInterpUs.toFixed(2)} µs` : '–'],
      ['Audio glitches skipped', source ? `${slips} pulse${slips === 1 ? '' : 's'}${captureMode ? (captureMode === 'direct' ? ' · direct' : ' · audio engine') : ''}` : '–'],
      ['Peak level L / R', `${dbfs(s.levelL)} / ${dbfs(s.levelR)} dBFS${clip ? '  CLIP' : ''}`, clip],
      ['Strongest return', s.peakRange != null ? `${(s.peakRange * u.per).toFixed(2)} ${u.ab} @ ${s.peakDB.toFixed(1)} dB` : '–'],
    ];
    $('stats').innerHTML = tiles.map(t => `<div class="tile${t[2] ? ' warn' : ''}"><div class="t">${t[0]}<\/div><div class="v">${t[1]}<\/div><\/div>`).join('');
  }

  // ---------------- audio sources ----------------
  let audioCtx = null, stream = null, devices = [], userPickedDevice = localStorage.getItem('ccr.device') || '';
  let fileName = '';
  let captureMode = null;   // 'direct' (MediaStreamTrackProcessor) or 'worklet' (AudioWorklet)
  let slips = 0;
  const looksLikeUCA = dv => /USB Audio CODEC|UCA ?2[02]2|Behringer/i.test(dv.label);
  const WORKLET = `class CCRCapture extends AudioWorkletProcessor {
  constructor() { super(); this.out = null; this.N = 2048; this.l = new Float32Array(this.N); this.r = new Float32Array(this.N); this.n = 0; this.frame = 0;
    this.port.onmessage = e => { if (e.data && e.data.port) this.out = e.data.port; }; }
  process(inputs) {
    const inp = inputs[0], len = inp && inp[0] ? inp[0].length : 128;
    if (inp && inp.length) {
      const a = inp[0], b = inp.length > 1 ? inp[1] : inp[0];
      for (let i = 0; i < a.length; i++) {
        this.l[this.n] = a[i]; this.r[this.n] = b[i]; this.n++;
        if (this.n === this.N) {

          this.l = new Float32Array(this.N); this.r = new Float32Array(this.N); this.n = 0;
        }
      }
    }
    this.frame += len;
    return true;
  }
}
registerProcessor('ccr-capture', CCRCapture);`;

  async function refreshDevices() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
    devices = (await navigator.mediaDevices.enumerateDevices()).filter(x => x.kind === 'audioinput');
    const sel = $('device');
    const prev = sel.value || userPickedDevice;
    sel.innerHTML = '';
    if (!devices.length) sel.append(new Option('No audio inputs', ''));
    devices.forEach((dv, i) => sel.append(new Option(dv.label || (i === 0 ? 'Default input (press Start to see names)' : `Input ${i + 1}`), dv.deviceId)));
    const uca = devices.find(looksLikeUCA);
    if (prev && devices.some(x => x.deviceId === prev)) sel.value = prev;
    else if (uca) sel.value = uca.deviceId;
  }

  function stopAll() {
    worker.postMessage({ type: 'stop' });

  function beginSource(kind, newFs) {

    updateToolbar();

  async function openStream(deviceId) {

  async function startLive() {
    stopAll();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('This browser can\'t read audio inputs here. Open the page over https (or from localhost), in Chrome, Edge, Firefox or Safari.', true);
      return;
    }
    try {
      setStatus('Asking for access to the audio input…');
      let chosen = $('device').value;
      stream = await openStream(chosen);
      await refreshDevices();
      // after access is granted the names are known: prefer the UCA222 unless the user chose another input
      const uca = devices.find(looksLikeUCA);
      const trackId = stream.getAudioTracks()[0].getSettings().deviceId;
      if (!userPickedDevice && uca && trackId !== uca.deviceId) {
        stream.getTracks().forEach(t => t.stop());
        stream = await openStream(uca.deviceId);
        $('device').value = uca.deviceId;
      }

      const name = track.label || 'audio input';
      const chans = st.channelCount;

      if (window.MediaStreamTrackProcessor && !/[?&]capture=worklet/.test(location.search)) {
        // Chrome, Edge: read the interface directly in the DSP thread (no audio engine, no clock drift)
        const mstp = new MediaStreamTrackProcessor({ track });
        beginSource('live', st.sampleRate || 48000);
        worker.postMessage({ type: 'liveDirect', readable: mstp.readable, fs: st.sampleRate || 48000, params }, [mstp.readable]);
        captureMode = 'direct';
        if (chans === 1) setStatus(`${name} is delivering only 1 channel. Trigger and IF need stereo: choose the interface's stereo input.`, true);
        else setStatus(`Live: ${name}, ${st.sampleRate || 48000} Hz${chText}, read directly.`);
        return;
      }
      captureMode = 'worklet';
      audioCtx = new AudioContext(st.sampleRate ? { sampleRate: st.sampleRate, latencyHint: 'interactive' } : { latencyHint: 'interactive' });
      const url = URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' }));
      await audioCtx.audioWorklet.addModule(url);
      const src = audioCtx.createMediaStreamSource(stream);
      const node = new AudioWorkletNode(audioCtx, 'ccr-capture', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1],
        channelCount: 2, channelCountMode: 'explicit', channelInterpretation: 'discrete' });
      const mute = audioCtx.createGain();
      mute.gain.value = 0;
      src.connect(node); node.connect(mute); mute.connect(audioCtx.destination);
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      const ch = new MessageChannel();
      node.port.postMessage({ port: ch.port1 }, [ch.port1]);
      beginSource('live', audioCtx.sampleRate);
      worker.postMessage({ type: 'live', port: ch.port2, fs: audioCtx.sampleRate, params }, [ch.port2]);
      if (chans === 1) setStatus(`${name} is delivering only 1 channel. Trigger and IF need stereo: choose the interface's stereo input.`, true);
      else setStatus(`Live: ${name}, ${audioCtx.sampleRate} Hz${chText}, through the browser's audio engine.`);
    } catch (err) {
      stopAll();
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      setStatus(denied ? 'Microphone access was refused. Allow this page to use the microphone (the address bar\'s site settings), then press Start.'
        : `Audio start failed: ${err && err.message ? err.message : err}`, true);
    }
  }

  function startSim() {
    stopAll();
    beginSource('sim', 48000);
    worker.postMessage({ type: 'sim', params });
    setStatus('Simulation. Radar tab: FMCW targets at 8 m (fixed), 13–37 m (moving) and 60 m, the sync period not a whole number of samples. Doppler tab: unmodulated CW, a car passing at 28 m/s and slowing to 8 m/s every 25 s, and a person walking at 1.4 m/s.');
  }

  /** Reads a PCM (16/24-bit) or float (32-bit) stereo .wav. */
  function parseWav(buf) {
    const b = new Uint8Array(buf), dv = new DataView(buf);
    const tag = o => String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);
    if (tag(0) !== 'RIFF' || tag(8) !== 'WAVE') return null;
    let off = 12, fmt = null, data = null;
    while (off + 8 <= b.length) {
      const id = tag(off), size = dv.getUint32(off + 4, true);
      if (id === 'fmt ') fmt = { format: dv.getUint16(off + 8, true), channels: dv.getUint16(off + 10, true), fs: dv.getUint32(off + 12, true), bits: dv.getUint16(off + 22, true) };
      if (id === 'data') { data = { off: off + 8, size: Math.min(size, b.length - off - 8) }; break; }
      off += 8 + size + (size & 1);
    }
    if (!fmt || !data) return null;
    if (fmt.format === 0xFFFE) fmt.format = fmt.bits === 32 ? 3 : 1;   // WAVE_FORMAT_EXTENSIBLE (assume PCM / float)
    const ch = fmt.channels, bytes = fmt.bits / 8, frames = Math.floor(data.size / (ch * bytes));
    const left = new Float32Array(frames), right = new Float32Array(frames);
    const rd = (p) => {
      if (fmt.format === 3 && fmt.bits === 32) return dv.getFloat32(p, true);
      if (fmt.bits === 16) return dv.getInt16(p, true) / 32768;
      if (fmt.bits === 24) { let v = b[p] | (b[p + 1] << 8) | (b[p + 2] << 16); if (v & 0x800000) v -= 0x1000000; return v / 8388608; }
      if (fmt.bits === 32) return dv.getInt32(p, true) / 2147483648;
      throw new Error('unsupported .wav sample format');
    };
    for (let i = 0; i < frames; i++) {
      const p = data.off + i * ch * bytes;
      left[i] = rd(p); right[i] = ch > 1 ? rd(p + bytes) : left[i];
    }
    return { fs: fmt.fs, channels: ch, left, right };
  }

  async function openFile(file) {
    stopAll();
    fileName = file.name;
    setStatus(`Reading ${file.name}…`);
    try {
      const buf = await file.arrayBuffer();
      let w = parseWav(buf);
      if (!w) {
        const ctx = new AudioContext();
        const ab = await ctx.decodeAudioData(buf.slice(0));
        w = { fs: ab.sampleRate, channels: ab.numberOfChannels, left: ab.getChannelData(0), right: ab.getChannelData(Math.min(1, ab.numberOfChannels - 1)) };
        ctx.close();
      }
      if (w.channels < 2) { setStatus(`${file.name} has one channel: the trigger and IF need a stereo recording.`, true); return; }
      beginSource('file', w.fs);
      const secs = w.left.length / w.fs;
      worker.postMessage({ type: 'file', left: w.left, right: w.right, fs: w.fs, params, speed: 1 }, [w.left.buffer, w.right.buffer]);
      setStatus(`Playing ${file.name} in real time: ${secs.toFixed(1)} s at ${w.fs} Hz.`);
    } catch (err) {
      setStatus(`Couldn't read ${file.name}: ${err && err.message ? err.message : err}`, true);
    }
  }
